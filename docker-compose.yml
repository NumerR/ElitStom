services:
  postgres:
    image: postgres:16-alpine
    container_name: dentacore-postgres
    environment:
      POSTGRES_USER: dentacore
      POSTGRES_PASSWORD: dentacore
      POSTGRES_DB: dentacore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentacore -d dentacore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
